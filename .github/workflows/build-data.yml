name: Build data

# Runs the whole data pipeline on GitHub's servers, publishes the data as the "data" release
# (too big to keep committing to git) and deploys the website with it.
# Needs the repo secret TMDB_TOKEN (your TMDB "API Read Access Token").
# Start it from the Actions tab > Build data > Run workflow.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Shows to fetch: 'all' or a number (most popular first)"
        default: "all"
      min_votes:
        description: Leave out shows with fewer TMDB votes than this (0 = keep everything)
        default: "0"
      episodes_top:
        description: Shows to fetch episode ratings for (0 = skip)
        default: "5000"
      embeddings_top:
        description: Most popular shows that get vibe-search vectors (0 = skip)
        default: "40000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the TMDB secret is set
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::Add the repo secret TMDB_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r pipeline/requirements.txt

      # the TMDB cache is kept between runs, so a re-run only fetches what is missing
      - name: Restore TMDB cache
        uses: actions/cache/restore@v4
        with:
          path: data/tmdb.sqlite
          key: tmdb-db-${{ github.run_id }}
          restore-keys: tmdb-db-

      # if fetching every show takes too long, carry on with what was downloaded;
      # the next run continues from the cache
      - name: Fetch shows from TMDB
        timeout-minutes: 200
        continue-on-error: true
        run: python pipeline/fetch_tmdb.py --limit ${{ inputs.limit }}

      - name: Fetch episode ratings
        if: ${{ inputs.episodes_top != '0' }}
        timeout-minutes: 40
        continue-on-error: true
        run: python pipeline/fetch_episodes.py --top ${{ inputs.episodes_top }}

      - name: Save TMDB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/tmdb.sqlite
          key: tmdb-db-${{ github.run_id }}

      - name: Build map
        run: python pipeline/build_map.py --min-votes ${{ inputs.min_votes }}

      - name: Build vibe-search embeddings
        if: ${{ inputs.embeddings_top != '0' }}
        run: python pipeline/build_embeddings.py --top ${{ inputs.embeddings_top }}

      - name: Publish data as the "data" release
        run: |
          COUNT=$(python -c "import json;print(json.load(open('web/public/data/shows.json'))['count'])")
          tar -czf data.tar.gz -C web/public/data .
          ls -lh data.tar.gz
          if gh release view data >/dev/null 2>&1; then
            gh release upload data data.tar.gz --clobber
            gh release edit data --notes "$COUNT shows · built $(date -u +%Y-%m-%d)"
          else
            gh release create data data.tar.gz --title "TV data (latest)" --notes "$COUNT shows · built $(date -u +%Y-%m-%d)"
          fi
          echo "### $COUNT shows published" >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
